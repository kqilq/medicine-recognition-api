name: Train YOLO Object Detection Model

on:
  workflow_dispatch:
  push:
    paths:
      - 'dataset/**'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics torch torchvision pillow pyyaml

      - name: Run Training Script
        run: |
          python train.py

      - name: Commit and Push Updated Model & Config
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update trained YOLO model and dataset config"
          file_pattern: "best.pt data.yaml dataset/"
