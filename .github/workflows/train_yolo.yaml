name: Train YOLO Object Detection Model

on:
  push:
    paths:
      - 'dataset/**'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ultralytics torch torchvision

    - name: Run Training Script
      run: python train.py

    # The action automatically handles pulling, rebasing, and committing!
    - name: Commit and Push Trained Model
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update trained YOLO model and dataset config"
        file_pattern: "*.pt data.yaml dataset/**"
        # Option to pull with rebase automatically before committing:
        push_options: '--force'
